<template id="page-template">
<div style="width: 100%; background: #FFFFFF; color: #090088; font-family: 'Figtree', Arial, sans-serif; font-size: 17px; line-height: 1.6; overflow: hidden">
  <header class="hdr"><div class="util"><div class="wrap urow"><a class="ulink" href="find-specialist-support.html">Find specialist support</a><a class="ulink" href="contact.html">Contact</a></div></div><div class="wrap hrow"><a class="hlogo" href="index.html" aria-label="WIPS home"><img src="assets/img/wips-mark-01-primary.png" alt="WIPS, Women in Protective Services"></a><nav class="dnav" aria-label="Primary"><div class="dd"><a class="navb" href="about.html">About WIPS<span class="car" aria-hidden="true">▾</span></a><div class="ddm"><a href="about.html">About WIPS</a><a href="our-people.html">Our people</a></div></div><a class="navb" href="what-we-do.html">What we do</a><a class="navb on" href="stories.html" aria-current="page">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav><div class="hact"><a class="btn bjoin" href="get-involved.html" style="min-height: 46px; padding: 0 22px">Get involved</a></div></div><nav class="mrow" aria-label="Menu"><a class="navb" href="about.html">About WIPS</a><a class="navb" href="our-people.html">Our people</a><a class="navb" href="what-we-do.html">What we do</a><a class="navb on" href="stories.html" aria-current="page">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav></header>

  <section style="background: #F6F1E6">
    <div class="wrap" style="padding-top: 56px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 22px">
      <nav aria-label="Breadcrumb" style="font-size: 14px; color: rgba(9,0,136,.72)"><a href="index.html" style="color: rgba(9,0,136,.72)">Home</a> / Stories</nav>
      <div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end">
        <h1 class="h1 rise" style="flex: 1.4 1 520px; min-width: 0">Her work, in <em class="em">her words.</em></h1>
        <div class="rise r2" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px"><p class="lead">Real women, real work. Profiles, interviews and features about the women of protective services, published with their approval.</p><div style="display: flex; flex-wrap: wrap; gap: 12px"><a class="btn dark" href="#tell" onClick="{{ goShare }}">Pitch your story</a><a class="btn ghost" href="#tell" onClick="{{ goNominate }}">Suggest a woman for WIPS Recognises</a></div></div>
      </div>
    </div>
  </section>

  <section style="padding: 96px 0 0">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
      <div class="rv" style="display: flex; flex-direction: column; gap: 18px"><span class="kick">Latest</span><h2 class="h2">Voices from <em class="em">WIPS.</em></h2></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 20px">
        <a class="mcard rv" href="https://youtu.be/tFeRQWi5J80"><span class="mi"><img src="assets/img/impact-room-podcast.jpg" alt="Satia Rai on The Impact Room podcast"></span><span class="mt"><span class="eyebrow">Media · Podcast</span><span class="disp" style="font-size: 28px; line-height: 1.1">The 500,000-strong workforce hiding in plain sight</span><span style="font-size: 17px">Satia Rai, Founder of WIPS, talks to Douglas Jackson on The Impact Room.</span><span style="margin-top: auto; font-weight: 700">Watch on YouTube →</span></span></a>
        <a class="mcard rv" href="our-people.html"><span class="mi"><img src="assets/img/lucy-macleod.jpg" alt="Lucy Macleod"></span><span class="mt"><span class="eyebrow">Profile · Fire and rescue</span><span class="disp" style="font-size: 28px; line-height: 1.1">Lucy Macleod</span><span style="font-size: 17px">Borough Commander, London Fire Brigade. The first woman in the UK to lead Technical Rescue, Most Influential Woman in Fire 2025, and a member of the WIPS Steering Group.</span><span style="margin-top: auto; font-weight: 700">Read her profile →</span></span></a>
      </div>
    </div>
  </section>

  <section style="padding: 96px 0 120px">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
      <div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 18px; max-width: 720px"><span class="kick">Feature · On the record</span><h2 class="h2">Laws and firsts that <em class="em">changed things.</em></h2><p class="lead">Six UK moments for women in protective services, with the sources behind each one.</p></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px">
        <sc-for list="{{ record }}" as="r" hint-placeholder-count="6">
          <article class="rec rv"><span class="yr">{{ r.year }}</span><span class="rh">{{ r.head }}</span><span class="rs">{{ r.sum }}</span><span class="src">Source: <a href="{{ r.url }}">{{ r.src }}</a></span></article>
        </sc-for>
      </div>
    </div>
  </section>

  <section id="tell" style="background: #F6F1E6; padding: 120px 0">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
      <div class="rv" style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <span class="kick">Contribute</span>
        <h2 class="h2">Every story starts with someone <em class="em">noticing.</em></h2>
        <p class="lead">Start with a short pitch, or suggest a woman for WIPS Recognises. We’ll follow up, and nothing is published without the approval of the woman it’s about.</p><p style="margin: 0; font-size: 17px">WIPS Recognises is not the annual awards. Award nominations aren’t open yet. Please don’t share details of abuse here; for help, see <a href="find-specialist-support.html" style="font-weight: 700">Find specialist support</a>.</p>
      </div>
      <form onSubmit="{{ submit }}" novalidate="novalidate" style="flex: 1.2 1 480px; min-width: 0; background: #FFFFFF; border-radius: 0; padding: clamp(24px, 3.4vw, 40px); display: flex; flex-direction: column; gap: 20px">
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 20px">
            <div class="seg" role="group" aria-label="What would you like to do?" style="align-self: flex-start"><sc-for list="{{ modes }}" as="m" hint-placeholder-count="2"><button type="button" class="{{ m.cls }}" aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}">{{ m.label }}</button></sc-for></div>
            <label class="fld">Your name<input type="text" autocomplete="name" placeholder="Sarah Ahmed" value="{{ name }}" onChange="{{ setName }}"></label>
            <label class="fld">Your email<input type="email" autocomplete="email" placeholder="sarah@example.com" value="{{ email }}" onChange="{{ setEmail }}"></label>
            <sc-if value="{{ isNominate }}" hint-placeholder-val="{{ false }}"><label class="fld swap">Her name<input type="text" placeholder="Who are you nominating?" value="{{ nominee }}" onChange="{{ setNominee }}"></label></sc-if>
            <label class="fld">{{ storyLabel }}<textarea rows="5" placeholder="{{ storyHint }}" value="{{ story }}" onChange="{{ setStory }}"></textarea></label>
            <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: #090088"><input type="checkbox" checked="{{ consent }}" onChange="{{ toggleConsent }}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #090088; flex: none">{{ consentText }}</label>
            <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #02006C">{{ err }}</p></sc-if>
            <button type="submit" class="btn dark" style="align-self: flex-end">{{ submitLabel }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 0">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: #FBE42A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#02006C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="disp" role="status" style="font-size: 32px; line-height: 1.1; color: #090088">{{ thanks }}</span>
            <p style="margin: 0; color: #090088">Someone from WIPS will read it and get back to you at {{ email }}.</p>
            <button type="button" class="btn ghost" onClick="{{ restart }}" style="align-self: flex-start">Send another</button>
          </div>
        </sc-if>
      </form>

<script src="assets/js/wips-runtime.js"></script>
<script>
const RECORD = [
  { year: '1915', head: 'The first woman in Britain with the power of arrest.', sum: 'Edith Smith was sworn in at Grantham, the first woman police officer in the UK with full powers of arrest.', src: 'GOV.UK History of Government', url: 'https://history.blog.gov.uk/2014/06/17/the-first-world-war-and-the-first-female-police-officer/' },
  { year: '1919', head: 'The law that said women could do the job.', sum: 'The Sex Disqualification (Removal) Act made it unlawful to bar women from public office and the professions because of their sex.', src: 'legislation.gov.uk', url: 'https://www.legislation.gov.uk/ukpga/Geo5/9-10/71/contents' },
  { year: '1968', head: 'The Met’s first Black woman police officer.', sum: 'Sislin Fay Allen joined the Metropolitan Police and was posted to Croydon.', src: 'The National Archives', url: 'https://www.nationalarchives.gov.uk/education/resources/significant-people-collection/sislin-fay-allen/' },
  { year: '1992', head: 'The first woman to run MI5.', sum: 'Stella Rimington became Director General of the Security Service, the first woman to lead a UK intelligence agency.', src: 'MI5', url: 'https://www.mi5.gov.uk/dame-stella-rimington' },
  { year: '1995', head: 'The first woman Chief Constable.', sum: 'Pauline Clare took command of Lancashire Constabulary, the first woman to lead a British police force.', src: 'Lancashire Post', url: 'https://lep.co.uk/heritage-and-retro/retro/how-history-was-made-when-lancashire-police-appointed-first-british-female-chief-constable-2881689' },
  { year: '2021', head: 'Domestic abuse got a legal definition.', sum: 'The Domestic Abuse Act 2021 defined domestic abuse in law for the first time, including economic abuse and controlling behaviour.', src: 'legislation.gov.uk', url: 'https://www.legislation.gov.uk/ukpga/2021/17/contents' }
];
const STORIES = [
  { series: 'WIPS Recognises', kind: 'rec' }, { series: 'Member story', kind: 'mem' }, { series: 'WIPS Recognises', kind: 'rec' },
  { series: 'Member story', kind: 'mem' }, { series: 'WIPS Recognises', kind: 'rec' }, { series: 'Member story', kind: 'mem' }
];
const FILTERS = [{ id: 'all', label: 'All stories' }, { id: 'rec', label: 'WIPS Recognises' }, { id: 'mem', label: 'Member stories' }];
const MODES = [{ id: 'share', label: 'Pitch my story' }, { id: 'nominate', label: 'Suggest a woman' }];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setIntent(o) { try { sessionStorage.setItem('wips-intent', JSON.stringify(o)); } catch (e) {} }
function readIntent() { try { const v = sessionStorage.getItem('wips-intent'); sessionStorage.removeItem('wips-intent'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function scrollToId(id) { setTimeout(() => { try { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 350); }
class Component extends DCLogic {
  state = { filter: 'all', mode: 'share', name: '', email: '', nominee: '', story: '', consent: false, err: '', sent: false };
  componentDidMount() { const it = readIntent(); if (it && it.mode) { this.setState({ mode: it.mode }); scrollToId('tell'); } }
  renderVals() {
    const s = this.state;
    const nominate = s.mode === 'nominate';
    const list = STORIES.filter((x) => s.filter === 'all' || x.kind === s.filter).map((x, i) => ({ ...x, cls: 'card scard t' + (i % 3) }));
    return {
      filters: FILTERS.map((f) => ({ ...f, cls: f.id === s.filter ? 'chip on' : 'chip', pressed: f.id === s.filter ? 'true' : 'false', pick: () => this.setState({ filter: f.id }) })),
      stories: list,
      record: RECORD,
      modes: MODES.map((m) => ({ ...m, cls: m.id === s.mode ? 'segb on' : 'segb', pressed: m.id === s.mode ? 'true' : 'false', pick: () => this.setState({ mode: m.id, err: '' }) })),
      goShare: () => this.setState({ mode: 'share', err: '' }),
      goNominate: () => this.setState({ mode: 'nominate', err: '' }),
      isNominate: nominate,
      storyLabel: nominate ? 'Why does her work deserve to be seen?' : 'Your pitch, in a few lines',
      storyHint: nominate ? 'What she does, and the difference it makes' : 'What you do, and what you’d like other women to know',
      consentText: nominate ? 'I understand WIPS will contact her first and won’t publish anything about her without her approval.' : 'I’m happy for WIPS to contact me about this pitch. I understand nothing is published without my approval.',
      submitLabel: nominate ? 'Send suggestion' : 'Send my pitch',
      thanks: nominate ? 'Thank you for your suggestion.' : 'Thank you for your pitch.',
      name: s.name, email: s.email, nominee: s.nominee, story: s.story, consent: s.consent,
      hasErr: !!s.err, err: s.err, sent: s.sent, notSent: !s.sent,
      setName: (e) => this.setState({ name: e.target.value, err: '' }),
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      setNominee: (e) => this.setState({ nominee: e.target.value, err: '' }),
      setStory: (e) => this.setState({ story: e.target.value, err: '' }),
      toggleConsent: () => this.setState({ consent: !this.state.consent, err: '' }),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const st = this.state;
        if (!st.name.trim()) { this.setState({ err: 'Enter your name.' }); return; }
        if (!EMAIL_RE.test(st.email.trim())) { this.setState({ err: 'Enter an email address like name@example.com.' }); return; }
        if (st.mode === 'nominate' && !st.nominee.trim()) { this.setState({ err: 'Enter the name of the woman you’re nominating.' }); return; }
        if (st.story.trim().length < 20) { this.setState({ err: 'Tell us a little more, at least a sentence or two.' }); return; }
        if (!st.consent) { this.setState({ err: 'Tick the box to confirm.' }); return; }
        this.setState({ sent: true, err: '' });
      },
      restart: () => this.setState({ sent: false, nominee: '', story: '', consent: false, err: '' })
    };
  }
}
WIPS.mount(Component);
</script>
