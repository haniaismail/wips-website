];
const FILTERS = [{ id: 'all', label: 'All' }, { id: 'open', label: 'Open now' }, { id: 'dev', label: 'In development' }];
const NUMS = ['01', '02', '03', '04', '05', '06', '07'];
function setIntent(o) { try { sessionStorage.setItem('wips-intent', JSON.stringify(o)); } catch (e) {} }
function readIntent() { try { const v = sessionStorage.getItem('wips-intent'); sessionStorage.removeItem('wips-intent'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function scrollToId(id) { setTimeout(() => { try { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 350); }
class Component extends DCLogic {
  state = { filter: 'all' };
  componentDidMount() { const it = readIntent(); if (it && it.prog) scrollToId(it.prog); }
  renderVals() {
    const s = this.state;
    const list = PROGS.map((g, i) => ({ ...g, n: NUMS[i] })).filter((g) => s.filter === 'all' || (s.filter === 'open' ? g.open : !g.open));
    return {
      filters: FILTERS.map((f) => ({ ...f, cls: f.id === s.filter ? 'fchip on' : 'fchip', pressed: f.id === s.filter ? 'true' : 'false', pick: () => this.setState({ filter: f.id }) })),
      progs: list.map((g) => ({ ...g, statusCls: g.open ? 'status open' : 'status', go: () => setIntent(g.intent) })),
      goShare: () => setIntent({ mode: 'share' }),
      goJoin: () => setIntent({ join: 'community', track: 'ind' }),
      goPartner: () => setIntent({ join: 'partner', track: 'org' }),
      ideaGo: () => setIntent({ topic: 'idea' })
    };
  }
}
WIPS.mount(Component);
</script>
