<script>
const ITEMS = [
  { type: 'News', date: 'Nov 2026', title: 'Introducing the WIPS Steering Group', meta: 'Seven women from across protective services steering WIPS', href: 'our-people.html' },
  { type: 'Event', date: '11 Nov 2026', title: 'The first WIPS session at Safety & Security Asia', meta: 'Women in Protective Services – Next-Gen panel, moderated by Satia Rai · Singapore', href: '#singapore' },
  { type: 'Event', date: '25–26 Nov 2026', title: 'The Security Event Australia, Melbourne', meta: 'WIPS is an industry partner · Register free', href: 'https://melbournebuildexpo.com/wips-2026' },
  { type: 'Media', date: 'Oct 2026', title: 'The Impact Room: the 500,000-strong workforce hiding in plain sight', meta: 'Satia Rai with Douglas Jackson', href: 'https://youtu.be/tFeRQWi5J80' }
];
const FILTERS = [{ id: 'all', label: 'All' }, { id: 'News', label: 'News' }, { id: 'Event', label: 'Events' }, { id: 'Media', label: 'Media' }];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setIntent(o) { try { sessionStorage.setItem('wips-intent', JSON.stringify(o)); } catch (e) {} }
function readIntent() { try { const v = sessionStorage.getItem('wips-intent'); sessionStorage.removeItem('wips-intent'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function scrollToId(id) { setTimeout(() => { try { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 350); }
class Component extends DCLogic {
  state = { filter: 'all', email: '', err: '', subbed: false };
  componentDidMount() { const it = readIntent(); if (it && it.news === 'subscribe') scrollToId('newsletter'); }
  renderVals() {
    const s = this.state;
    return {
      filters: FILTERS.map((f) => ({ ...f, cls: f.id === s.filter ? 'chip on' : 'chip', pressed: f.id === s.filter ? 'true' : 'false', pick: () => this.setState({ filter: f.id }) })),
      items: ITEMS.filter((n) => s.filter === 'all' || n.type === s.filter),
      email: s.email, hasErr: !!s.err, err: s.err, subbed: s.subbed, notSubbed: !s.subbed,
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      subscribe: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!EMAIL_RE.test(this.state.email.trim())) { this.setState({ err: 'Enter an email address like name@example.com.' }); return; }
        this.setState({ subbed: true, err: '' });
      }
    };
  }
}
WIPS.mount(Component);
</script>
