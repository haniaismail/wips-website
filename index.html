.strap{background:#090088;color:#FBE42A;text-align:center;padding:8px 0 64px}

.sec{padding:120px 0}

.c3{padding:36px 36px 8px 0;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.c3 .ct{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:500;font-size:46px;line-height:1;letter-spacing:-0.03em;color:#FFFFFF}

.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}

.p15{object-position:center 15%}.p20{object-position:center 20%}.p25{object-position:center 25%}

.now{display:flex;flex-direction:column;gap:16px;padding:34px;background:#FFFFFF;border:2px solid #090088;box-sizing:border-box;min-height:300px;transition:transform .35s cubic-bezier(.2,.75,.1,1),box-shadow .35s ease}

.voice{display:flex;flex-wrap:wrap;background:#6CCDFC;color:#090088;text-decoration:none;overflow:hidden}

.voice .vn{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:500;font-size:30px;line-height:1.08;letter-spacing:-0.02em}

.voice .go span{transition:transform .25s ease}.voice:hover .go span{transform:translateX(6px)}
.news{display:flex;flex-direction:column;gap:14px;padding:30px;background:#FFFFFF;border-top:6px solid #090088;text-decoration:none;color:#090088;box-sizing:border-box;transition:transform .35s cubic-bezier(.2,.75,.1,1)}
.news:hover{transform:translateY(-6px)}
.tagb{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px}
.feat{display:flex;flex-wrap:wrap;background:#090088;color:#FFFFFF}
.feat .fi{flex:1 1 360px;min-width:0;aspect-ratio:1 / 1;background:#6CCDFC}
.feat .fi img{width:100%;height:100%;object-fit:cover;display:block}
.feat .ft{flex:1 1 360px;min-width:0;padding:44px;display:flex;flex-direction:column;gap:18px}

.route{display:flex;flex-direction:column;gap:14px;padding:34px;border:2px solid #090088;box-sizing:border-box}
.route .rt{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-0.02em}
.route .rb{font-size:18px;line-height:1.55;flex-grow:1}
.settle{animation:settle 2.6s cubic-bezier(.2,.7,.1,1) both}
.rise{animation:rise 1s cubic-bezier(.2,.75,.1,1) both}.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}
@keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){.rv{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 22%}}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:960px){.hero{height:720px}.hcopy{padding-bottom:48px}.sec{padding:88px 0}.feat .ft,.c3{padding:30px}}
</style>
<style>.dc-ready .rise,.dc-ready .settle,.dc-ready .swap{animation:none !important}</style>
