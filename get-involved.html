<style>
body{margin:0;background:#FFFFFF}
a{color:inherit}a:hover{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;box-sizing:border-box}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.03em}
.h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(40px,4.8vw,68px);line-height:1.04;letter-spacing:-0.03em;margin:0;color:#090088}
.h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(32px,3.6vw,50px);line-height:1.06;letter-spacing:-0.03em;margin:0;color:#090088}
.em{font-style:italic;font-weight: 400;color:#090088}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#090088}
.kick:before{content:"";width:22px;height:2px;background:#FBE42A;display:block}
.lead{margin:0;font-size:18px;line-height:1.65;color:#090088}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius: 0;font:inherit;font-size:15px;font-weight:600;text-decoration:none;border:0;cursor:pointer;box-sizing:border-box;transition:transform .25s ease,background .25s ease,color .25s ease,border-color .25s ease}
.btn:hover{transform:translateY(-2px)}
.dark{background:#090088;color:#FFFFFF}.dark:hover{background:#02006C;color:#FFFFFF}
.ghost{background:transparent;color:#090088;border:1px solid rgba(9,0,136,.25)}.ghost:hover{border-color:#090088;color:#090088}
.rose{background:#FBE42A;color:#02006C}.rose:hover{color:#02006C}
.navb{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#090088;text-decoration:none;padding:8px 0;border-bottom:1.5px solid transparent;transition:border-color .2s ease;white-space:nowrap}
.navb:hover,.navb.on{border-bottom-color:#FBE42A}
.mrow{display:none}
.flink{color: #FFFFFF;text-decoration:none;transition:color .2s ease}.flink:hover{color:#FFFFFF}
.card{transition:transform .35s cubic-bezier(.2,.75,.1,1),box-shadow .35s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px -24px rgba(9,0,136,.3)}
.seg{display:inline-flex;background:#F6F1E6;border-radius: 0;padding:5px}
.segb{min-height:44px;padding:0 22px;border-radius: 0;border:0;background:transparent;font:inherit;font-size:15px;color:#090088;cursor:pointer;transition:background .25s ease,color .25s ease}
.segb.on{background:#090088;color:#FFFFFF}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius: 0;border:1px solid rgba(9,0,136,.18);background:#FFFFFF;font:inherit;color:#090088;cursor:pointer;transition:border-color .25s ease,background .25s ease}
.opt:hover{border-color:#090088}.opt.on{border-color:#090088;background:#F6F1E6}
.opt .ring{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(9,0,136,.6);flex:none;box-sizing:border-box;transition:border .2s ease}
.opt.on .ring{border:6px solid #090088}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#090088}
.fld input{font:inherit;font-size:16px;font-weight:400;color:#090088;background:#F6F1E6;border:1px solid rgba(9,0,136,.18);border-radius: 0;padding:14px 16px;outline:none;transition:border-color .2s ease}
.fld input:focus{border-color:#090088}
.faq{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:none;border:0;padding:24px 0;font:inherit;font-size:19px;color:#090088;text-align:left;cursor:pointer}
.faq .pl{width:36px;height:36px;border-radius:50%;border:1px solid rgba(9,0,136,.25);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .3s ease,background .3s ease}
.faq.open .pl{transform:rotate(45deg);background:#090088;border-color:#090088}
.faq.open .pl path{stroke:#FFFFFF}
.swap{animation:swap .55s cubic-bezier(.2,.75,.1,1) both}
.rise{animation:rise 1s cubic-bezier(.2,.75,.1,1) both}.r2{animation-delay:.15s}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){.rv{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 22%}}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.mnav{display:none !important}
@media (max-width:960px){.dnav{display:none !important}.mnav{display:inline-flex !important}.wrap{padding:0 20px}.topl{display:none !important}.mrow{display:flex !important}}

a{color:#090088}

.h1{font-size:clamp(44px,5.4vw,80px);line-height:1.02;margin:0;color:#090088}

.dark,.bb{background:#090088;color:#FFFFFF;border-color:#090088}.dark:hover,.bb:hover{background:#02006C;border-color:#02006C;color:#FFFFFF}
.bjoin{background:#090088;color:#FBE42A;border-color:#090088}.bjoin:hover{background:#02006C;border-color:#02006C;color:#FBE42A}
.rose,.by{background:#FBE42A;color:#090088;border-color:#FBE42A}.rose:hover,.by:hover{background:#FBE42A;color:#090088;border-color:#090088}

.ghost,.soft{background:transparent;color:#090088;border:2px solid #090088}.ghost:hover,.soft:hover{background:#090088;border-color:#090088;color:#FFFFFF}
.ghostw,.bow{background:transparent;color:#FFFFFF;border:2px solid #FFFFFF}.ghostw:hover,.bow:hover{background:#FFFFFF;border-color:#FFFFFF;color:#090088}
.light{background:#FFFFFF;color:#090088;border-color:#FFFFFF}.light:hover{background:#FBE42A;border-color:#FBE42A;color:#090088}
.more{font-weight:700;color:#090088}
.card:hover{box-shadow:none}
img{border-radius:0}
/* header */
.hdr{background:#FFFFFF;border-bottom:2px solid #090088;position:relative;z-index:5}
.hrow{min-height:104px;display:flex;align-items:center;justify-content:space-between;gap:32px}
.hlogo{display:block;flex:none}.hlogo img{width:48px;height:auto;display:block}

/* footer */
.ftr{background:#090088;color:#FFFFFF}
.frow1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:32px}
.flogo{display:block}.flogo img{width:240px;height:auto;display:block}
.fstrap{margin:0;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-style:italic;font-weight:400;font-size:28px;line-height:1.15;color:#FBE42A;letter-spacing:-0.01em}
.fli{width:52px;height:52px;border:2px solid #FBE42A;display:inline-flex;align-items:center;justify-content:center;transition:background .2s ease}

/* 11 Nov review: utility bar, About dropdown, focus */
.util{background:#F6F1E6;border-bottom:1px solid rgba(9,0,136,.12)}
.urow{display:flex;justify-content:flex-end;gap:24px;min-height:38px;align-items:center}
.ulink{font-size:14px;font-weight:600;color:#090088;text-decoration:none;border-bottom:2px solid transparent}
.ulink:hover{border-bottom-color:#090088}
.dd{position:relative;display:flex;align-items:center}

.ddm a{padding:12px 18px;font-size:16px;font-weight:600;color:#090088;text-decoration:none}
.ddm a:hover,.ddm a:focus-visible{background:#FBE42A}
.navb .car{display:inline-block;margin-left:6px;font-size:12px}
:focus-visible{outline:3px solid #090088;outline-offset:3px}
.ondark :focus-visible,.ftr :focus-visible,.hero :focus-visible{outline-color:#FBE42A}
.status{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:2px solid currentColor}

<style>.dc-ready .rise,.dc-ready .settle,.dc-ready .swap{animation:none !important}</style>

<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">This site needs JavaScript turned on.</p></noscript>
<template id="page-template">
<div style="width: 100%; background: #FFFFFF; color: #090088; font-family: 'Figtree', Arial, sans-serif; font-size: 17px; line-height: 1.6; overflow: hidden">
  <header class="hdr"><div class="util"><div class="wrap urow"><a class="ulink" href="find-specialist-support.html">Find specialist support</a><a class="ulink" href="contact.html">Contact</a></div></div><div class="wrap hrow"><a class="hlogo" href="index.html" aria-label="WIPS home"><img src="assets/img/wips-mark-01-primary.png" alt="WIPS, Women in Protective Services"></a><nav class="dnav" aria-label="Primary"><div class="dd"><a class="navb" href="about.html">About WIPS<span class="car" aria-hidden="true">▾</span></a><div class="ddm"><a href="about.html">About WIPS</a><a href="our-people.html">Our people</a></div></div><a class="navb" href="what-we-do.html">What we do</a><a class="navb" href="stories.html">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav><div class="hact"><a class="btn bjoin" href="get-involved.html" style="min-height: 46px; padding: 0 22px">Get involved</a></div></div><nav class="mrow" aria-label="Menu"><a class="navb" href="about.html">About WIPS</a><a class="navb" href="our-people.html">Our people</a><a class="navb" href="what-we-do.html">What we do</a><a class="navb" href="stories.html">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav></header>

  <section style="background: #F6F1E6">
    <div class="wrap" style="padding-top: 56px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 22px">
      <nav aria-label="Breadcrumb" style="font-size: 14px; color: rgba(9,0,136,.72)"><a href="index.html" style="color: rgba(9,0,136,.72)">Home</a> / Get involved</nav>
      <div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end">
        <h1 class="h1 rise" style="flex: 1.4 1 520px; min-width: 0">A movement built <em class="em">with you.</em></h1>
        <p class="lead rise r2" style="flex: 1 1 340px; min-width: 0">Whether you do the work, want to, champion the women who do, or employ them, there’s a place for you in WIPS.</p>
      </div>
    </div>
  </section>

  <section style="padding: 96px 0 120px">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
      <div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px">
        <h2 class="h2" style="font-size: clamp(28px, 2.8vw, 38px)">Ways to get involved</h2>
        <div class="seg" role="group" aria-label="Show options for"><sc-for list="{{ tracks }}" as="t" hint-placeholder-count="2"><button type="button" class="{{ t.cls }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for></div>
      </div>
      <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="1">
        <sc-if value="{{ t.on }}" hint-placeholder-val="{{ true }}">
          <div class="swap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px">
            <sc-for list="{{ t.offers }}" as="o" hint-placeholder-count="2">
              <div class="card" style="background: #FFFFFF; border: 1px solid rgba(9,0,136,.15); border-radius: 0; padding: 36px; display: flex; flex-direction: column; gap: 20px">
                <h3 class="disp" style="margin: 0; font-weight: 500; font-size: 30px; line-height: 1.1; color: #090088">{{ o.title }}</h3>
                <p style="margin: 0; color: rgba(9,0,136,.72)">{{ o.desc }}</p>
                <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
                  <sc-for list="{{ o.points }}" as="pt" hint-placeholder-count="3"><li style="display: flex; gap: 12px; align-items: baseline; color: #090088"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex: none; transform: translateY(2px)"><path d="M2.5 7.5l3 3 6-7" stroke="#090088" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>{{ pt }}</li></sc-for>
                </ul>
                <a class="btn ghost" href="#form" onClick="{{ o.go }}" style="align-self: flex-start">{{ o.cta }}</a>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </section>

  <section id="form" style="background: #F6F1E6; padding: 120px 0">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
      <div class="rv" style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <span class="kick">Register interest</span>
        <h2 class="h2">Register your <em class="em">interest.</em></h2>
        <p class="lead" style="max-width: 36ch">Tell us who you are and how you’d like to be involved. This is an expression of interest, not a formal membership, and it takes a minute.</p><p style="margin: 0; font-size: 17px; max-width: 40ch">Your ideas and feedback help shape what WIPS builds next.</p>
      </div>
      <form onSubmit="{{ submit }}" novalidate="novalidate" style="flex: 1.2 1 460px; min-width: 0; background: #FFFFFF; border-radius: 0; padding: clamp(24px, 3.4vw, 40px); display: flex; flex-direction: column; gap: 22px">
        <sc-if value="{{ step1 }}" hint-placeholder-val="{{ true }}">
          <div class="swap" style="display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px"><span class="disp" style="font-size: 24px; color: #090088">How would you like to be involved?</span><span style="font-size: 14px; color: rgba(9,0,136,.72); white-space: nowrap">Step 1 of 2</span></div>
            <div role="group" aria-label="How would you like to be involved?" style="display: flex; flex-direction: column; gap: 10px"><sc-for list="{{ joins }}" as="j" hint-placeholder-count="3"><button type="button" class="{{ j.cls }}" aria-pressed="{{ j.pressed }}" onClick="{{ j.pick }}"><span class="ring"></span><span><span style="display: block; font-weight: 600">{{ j.label }}</span><span style="display: block; font-size: 14px; color: rgba(9,0,136,.72)">{{ j.sub }}</span></span></button></sc-for></div>
            <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #02006C">{{ err }}</p></sc-if>
            <button type="button" class="btn dark" onClick="{{ next }}" style="align-self: flex-end">Continue</button>
          </div>
        </sc-if>
        <sc-if value="{{ step2 }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px"><span class="disp" style="font-size: 24px; color: #090088">{{ joinLabel }}</span><span style="font-size: 14px; color: rgba(9,0,136,.72); white-space: nowrap">Step 2 of 2</span></div>
            <label class="fld">Your name<input type="text" autocomplete="name" placeholder="Sarah Ahmed" value="{{ name }}" onChange="{{ setName }}"></label>
            <label class="fld">Email<input type="email" autocomplete="email" placeholder="sarah@example.com" value="{{ email }}" onChange="{{ setEmail }}"></label>
            <label class="fld">Country<input type="text" autocomplete="country-name" placeholder="United Kingdom" value="{{ country }}" onChange="{{ setCountry }}"></label>
            <sc-if value="{{ isPartner }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 18px"><label class="fld">Organisation<input type="text" autocomplete="organization" placeholder="Your organisation" value="{{ org }}" onChange="{{ setOrg }}"></label><label class="fld">What could your organisation contribute? (optional)<textarea rows="4" placeholder="Event collaboration, mentoring expertise, research, inclusive employment, programme support" value="{{ contrib }}" onChange="{{ setContrib }}"></textarea></label></div></sc-if>
            <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #02006C">{{ err }}</p></sc-if>
            <p style="margin: 0; font-size: 14px; color: rgba(9,0,136,.72)">We’ll only use this to contact you about WIPS. Please don’t include personal details about abuse here.</p>
            <div style="display: flex; justify-content: space-between; gap: 12px"><button type="button" class="btn ghost" onClick="{{ back }}">Back</button><button type="submit" class="btn dark">{{ submitLabel }}</button></div>
          </div>
        </sc-if>
        <sc-if value="{{ step3 }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 0">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: #FBE42A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#02006C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="disp" role="status" style="font-size: 34px; line-height: 1.08; color: #090088">Thank you, {{ firstName }}.</span>
            <p style="margin: 0; color: #090088">{{ doneText }}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 12px"><a class="btn dark" href="stories.html" onClick="{{ shareGo }}">Share your story</a><button type="button" class="btn ghost" onClick="{{ restart }}">Start again</button></div>
          </div>
        </sc-if>
      </form>
    </div>
  </section>

  <section style="padding: 120px 0">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px">
      <div class="rv" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px"><span class="kick">Questions</span><h2 class="h2">Good to <em class="em">know.</em></h2><a class="btn ghost" href="contact.html" style="align-self: flex-start">Ask us something else</a></div>
      <div style="flex: 2 1 560px; min-width: 0; border-bottom: 1px solid rgba(9,0,136,.18)">
        <sc-for list="{{ faqs }}" as="q" hint-placeholder-count="5">
          <div style="border-top: 1px solid rgba(9,0,136,.18)">
            <button type="button" class="{{ q.cls }}" aria-expanded="{{ q.expanded }}" onClick="{{ q.toggle }}"><span>{{ q.q }}</span><span class="pl" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="#090088" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span></button>
            <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}"><p class="swap" style="margin: 0 0 24px; color: #090088; max-width: 60ch">{{ q.a }}</p></sc-if>
          </div>
        </sc-for>

<script src="assets/js/wips-runtime.js"></script>
<script>
const TRACKS = [
  { id: 'ind', label: 'For individuals', offers: [
    { title: 'Join the community', desc: 'For women working in, entering or aspiring to careers across protective services, anywhere in the world.', points: ['Connect with women across sectors and countries', 'Hear about events and programmes as they open', 'Share your story, or suggest a woman to feature'], cta: 'Register interest', join: 'community' },
    { title: 'Next generation', desc: 'For students, apprentices, early-career professionals and emerging women leaders.', points: ['Meet role models and mentors', 'Explore careers across protective services', 'Grow with WIPS as you progress'], cta: 'Register interest', join: 'nextgen' },
    { title: 'Global Sector Ambassadors', desc: 'WIPS plans to appoint ambassadors who connect women in their sector and champion the mission. The role and appointment process are still being agreed.', points: ['Represent WIPS in your sector and country', 'Amplify women’s voices and stories', 'Build international relationships'], cta: 'Express interest', join: 'ambassador' }
  ] },
  { id: 'org', label: 'For organisations and allies', offers: [
    { title: 'Organisations', desc: 'For employers and organisations committed to supporting women across protective services. Formal partnership packages will follow once terms are agreed.', points: ['Event collaboration', 'Mentoring expertise and research', 'Inclusive employment and programme support'], cta: 'Make a partnership enquiry', join: 'partner' },
    { title: 'Strategic and specialist partners', desc: 'For professional bodies, government, academia, charities, NGOs and specialist services.', points: ['Collaborate on research', 'Help design survivor employment pathways', 'Contribute to sector conversations'], cta: 'Make a partnership enquiry', join: 'partner' },
    { title: 'Ally', desc: 'For anyone who actively supports the WIPS mission and the progression of women.', points: ['Champion women where you work', 'Share WIPS stories and events', 'Open doors for the next generation'], cta: 'Register as an ally', join: 'ally' }
  ] }
];
const JOINS = [
  { id: 'community', label: 'Community', sub: 'For women in, entering or aspiring to protective careers' },
  { id: 'nextgen', label: 'Next generation', sub: 'For students, apprentices and early-career women' },
  { id: 'ambassador', label: 'Ambassador interest', sub: 'Tell us you’d like to represent WIPS in your sector or country' },
  { id: 'partner', label: 'Partnership enquiry', sub: 'For organisations and specialist partners' },
  { id: 'ally', label: 'Ally', sub: 'For anyone who supports the WIPS mission' }
];
const FAQS = [
  { id: 'who', q: 'Who is WIPS for?', a: 'Women working in, entering or aspiring to careers across protective and public safety services, anywhere in the world, plus the organisations and allies who support them.' },
  { id: 'cost', q: 'Does it cost anything?', a: 'Participation terms, including any fees, haven’t been agreed yet. Registering your interest is free and doesn’t commit you to anything.' },
  { id: 'men', q: 'Can men get involved?', a: 'Yes. Allies who actively support the WIPS mission and the progression of women are welcome.' },
  { id: 'where', q: 'I’m not in the UK. Can I still join?', a: 'Yes. WIPS is a global movement. Local chapters are planned and will grow in phases; none are active yet.' },
  { id: 'founder', q: 'Who started WIPS?', a: 'WIPS was founded by Satia Rai, who began her career on the frontline 30 years ago.' },
  { id: 'data', q: 'What happens to my details?', a: 'We use them only to contact you about WIPS. You can ask us to remove them at any time.' }
];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setIntent(o) { try { sessionStorage.setItem('wips-intent', JSON.stringify(o)); } catch (e) {} }
function readIntent() { try { const v = sessionStorage.getItem('wips-intent'); sessionStorage.removeItem('wips-intent'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function scrollToId(id) { setTimeout(() => { try { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 350); }
class Component extends DCLogic {
  state = { track: 'ind', faq: 'who', step: 1, join: '', name: '', email: '', country: '', org: '', contrib: '', err: '' };
  componentDidMount() { const it = readIntent(); if (it && it.join) { this.setState({ join: it.join, track: it.track || this.state.track, step: 1, err: '' }); scrollToId(it.track ? 'form' : 'form'); } }
  renderVals() {
    const s = this.state;
    const chosen = JOINS.find((j) => j.id === s.join);
    return {
      tracks: TRACKS.map((t) => ({
        ...t, on: t.id === s.track, cls: t.id === s.track ? 'segb on' : 'segb', pressed: t.id === s.track ? 'true' : 'false',
        pick: () => this.setState({ track: t.id }),
        offers: t.offers.map((o) => ({ ...o, go: () => this.setState({ join: o.join, step: 1, err: '' }) }))
      })),
      joins: JOINS.map((j) => ({ ...j, cls: j.id === s.join ? 'opt on' : 'opt', pressed: j.id === s.join ? 'true' : 'false', pick: () => this.setState({ join: j.id, err: '' }) })),
      faqs: FAQS.map((q) => ({ ...q, open: q.id === s.faq, cls: q.id === s.faq ? 'faq open' : 'faq', expanded: q.id === s.faq ? 'true' : 'false', toggle: () => this.setState({ faq: this.state.faq === q.id ? '' : q.id }) })),
      shareGo: () => setIntent({ mode: 'share' }),
      step1: s.step === 1, step2: s.step === 2, step3: s.step === 3,
      isPartner: s.join === 'partner', joinLabel: chosen ? chosen.label : '',
      hasErr: !!s.err, err: s.err, name: s.name, email: s.email, country: s.country, org: s.org, contrib: s.contrib,
      submitLabel: s.join === 'partner' ? 'Send enquiry' : 'Register interest',
      doneText: s.join === 'partner' ? 'We’ve got your enquiry and will reply to ' + s.email + '.' : 'You’ve registered your interest. We’ll be in touch at ' + s.email + ' about WIPS.',
      firstName: (s.name.trim().split(/\s+/)[0]) || 'there',
      setName: (e) => this.setState({ name: e.target.value, err: '' }),
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      setCountry: (e) => this.setState({ country: e.target.value, err: '' }),
      setOrg: (e) => this.setState({ org: e.target.value, err: '' }),
      setContrib: (e) => this.setState({ contrib: e.target.value }),
      next: () => { if (!this.state.join) { this.setState({ err: 'Choose one option to continue.' }); return; } this.setState({ step: 2, err: '' }); },
      back: () => this.setState({ step: 1, err: '' }),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const st = this.state;
        if (!st.name.trim()) { this.setState({ err: 'Enter your name.' }); return; }
        if (!EMAIL_RE.test(st.email.trim())) { this.setState({ err: 'Enter an email address like name@example.com.' }); return; }
        if (!st.country.trim()) { this.setState({ err: 'Enter your country.' }); return; }
        if (st.join === 'partner' && !st.org.trim()) { this.setState({ err: 'Enter your organisation’s name.' }); return; }
        this.setState({ step: 3, err: '' });
      },
      restart: () => this.setState({ step: 1, join: '', name: '', email: '', country: '', org: '', contrib: '', err: '' })
    };
  }
}
WIPS.mount(Component);
</script>
