<style>
body{margin:0;background:#FFFFFF}
a{color:inherit}a:hover{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;box-sizing:border-box}

.em{font-style:italic;font-weight: 400;color:#090088}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#090088}

.lead{margin:0;font-size:18px;line-height:1.65;color:#090088}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius: 0;font:inherit;font-size:15px;font-weight:600;text-decoration:none;border:0;cursor:pointer;box-sizing:border-box;transition:transform .25s ease,background .25s ease,color .25s ease,border-color .25s ease}
.btn:hover{transform:translateY(-2px)}
.dark{background:#090088;color:#FFFFFF}.dark:hover{background:#02006C;color:#FFFFFF}
.ghost{background:transparent;color:#090088;border:1px solid rgba(9,0,136,.25)}.ghost:hover{border-color:#090088;color:#090088}
.rose{background:#FBE42A;color:#02006C}.rose:hover{color:#02006C}
.navb{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#090088;text-decoration:none;padding:8px 0;border-bottom:1.5px solid transparent;transition:border-color .2s ease;white-space:nowrap}

.mrow{display:none}
.flink{color: #FFFFFF;text-decoration:none;transition:color .2s ease}.flink:hover{color:#FFFFFF}
.chip{min-height:44px;padding:0 18px;border-radius: 0;border:1px solid rgba(9,0,136,.25);background:#FFFFFF;font:inherit;font-size:14px;color:#090088;cursor:pointer;transition:all .25s ease}
.chip:hover{border-color:#090088}.chip.on{background:#090088;border-color:#090088;color:#FFFFFF}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#090088}
.fld input,.fld textarea{font:inherit;font-size:16px;font-weight:400;color:#090088;background:#F6F1E6;border:1px solid rgba(9,0,136,.18);border-radius: 0;padding:14px 16px;outline:none;transition:border-color .2s ease;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:#090088}

.rise{animation:rise 1s cubic-bezier(.2,.75,.1,1) both}.r2{animation-delay:.15s}

@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){.rv{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 22%}}}

.mnav{display:none !important}

.kick:before{content:"";width:28px;height:4px;background:currentColor;display:block}

.dark,.bb{background:#090088;color:#FFFFFF;border-color:#090088}.dark:hover,.bb:hover{background:#02006C;border-color:#02006C;color:#FFFFFF}

.rose,.by{background:#FBE42A;color:#090088;border-color:#FBE42A}.rose:hover,.by:hover{background:#FBE42A;color:#090088;border-color:#090088}

.light{background:#FFFFFF;color:#090088;border-color:#FFFFFF}.light:hover{background:#FBE42A;border-color:#FBE42A;color:#090088}

/* 11 Nov review: utility bar, About dropdown, focus */
.util{background:#F6F1E6;border-bottom:1px solid rgba(9,0,136,.12)}

<div id="app"></div>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">This site needs JavaScript turned on.</p></noscript>
<template id="page-template">
<div style="width: 100%; background: #FFFFFF; color: #090088; font-family: 'Figtree', Arial, sans-serif; font-size: 17px; line-height: 1.6; overflow: hidden">
  <header class="hdr"><div class="util"><div class="wrap urow"><a class="ulink" href="find-specialist-support.html">Find specialist support</a><a class="ulink" href="contact.html">Contact</a></div></div><div class="wrap hrow"><a class="hlogo" href="index.html" aria-label="WIPS home"><img src="assets/img/wips-mark-01-primary.png" alt="WIPS, Women in Protective Services"></a><nav class="dnav" aria-label="Primary"><div class="dd"><a class="navb" href="about.html">About WIPS<span class="car" aria-hidden="true">▾</span></a><div class="ddm"><a href="about.html">About WIPS</a><a href="our-people.html">Our people</a></div></div><a class="navb" href="what-we-do.html">What we do</a><a class="navb" href="stories.html">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav><div class="hact"><a class="btn bjoin" href="get-involved.html" style="min-height: 46px; padding: 0 22px">Get involved</a></div></div><nav class="mrow" aria-label="Menu"><a class="navb" href="about.html">About WIPS</a><a class="navb" href="our-people.html">Our people</a><a class="navb" href="what-we-do.html">What we do</a><a class="navb" href="stories.html">Stories</a><a class="navb" href="news-and-events.html">News and events</a></nav></header>

  <section style="background: #F6F1E6">
    <div class="wrap" style="padding-top: 56px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 22px">
      <nav aria-label="Breadcrumb" style="font-size: 14px; color: rgba(9,0,136,.72)"><a href="index.html" style="color: rgba(9,0,136,.72)">Home</a> / Contact and press</nav>
      <div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end">
        <h1 class="h1 rise" style="flex: 1.4 1 520px; min-width: 0">Get in <em class="em">touch.</em></h1>
        <p class="lead rise r2" style="flex: 1 1 340px; min-width: 0">Questions, partnerships, press or an idea for WIPS. Tell us what it’s about and we’ll get it to the right person.</p>
      </div>
    </div>
  </section>

  <section style="padding: 96px 0 120px">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
      <form onSubmit="{{ submit }}" novalidate="novalidate" class="rv" style="flex: 1.4 1 520px; min-width: 0; border: 1px solid rgba(9,0,136,.15); border-radius: 0; padding: clamp(24px, 3.4vw, 40px); display: flex; flex-direction: column; gap: 20px">
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 20px">
            <div style="display: flex; flex-direction: column; gap: 10px"><span class="eyebrow" style="color: #090088">What’s it about?</span><div role="group" aria-label="What’s it about?" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ topics }}" as="t" hint-placeholder-count="4"><button type="button" class="{{ t.cls }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for></div></div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
              <label class="fld">Your name<input type="text" autocomplete="name" placeholder="Sarah Ahmed" value="{{ name }}" onChange="{{ setName }}"></label>
              <label class="fld">Email<input type="email" autocomplete="email" placeholder="sarah@example.com" value="{{ email }}" onChange="{{ setEmail }}"></label>
            </div>
            <label class="fld">{{ orgLabel }}<input type="text" autocomplete="organization" placeholder="{{ orgHint }}" value="{{ org }}" onChange="{{ setOrg }}"></label>
            <label class="fld">Message<textarea rows="6" placeholder="How can we help?" value="{{ msg }}" onChange="{{ setMsg }}"></textarea></label>
            <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #02006C">{{ err }}</p></sc-if>
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px"><span style="font-size: 14px; color: rgba(9,0,136,.72); max-width: 34ch">Need help now? This form isn’t monitored for emergencies. <a href="find-specialist-support.html" style="font-weight: 700">Find specialist support</a>.</span><button type="submit" class="btn dark">Send message</button></div>
          </div>
        </sc-if>
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 0">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: #FBE42A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#02006C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="disp" role="status" style="font-size: 32px; line-height: 1.1; color: #090088">Thanks, {{ firstName }}. Message sent.</span>
            <p style="margin: 0; color: #090088">We’ll reply to {{ email }}.</p>
            <button type="button" class="btn ghost" onClick="{{ restart }}" style="align-self: flex-start">Send another message</button>
          </div>
        </sc-if>
      </form>
      <aside class="rv" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
                <div style="background: #F6F1E6; border-radius: 0; padding: 28px; display: flex; flex-direction: column; gap: 6px"><span class="eyebrow" style="color: #090088">Follow</span><a href="https://www.linkedin.com/company/women-in-protective-services-wips/" style="color: #090088; font-weight: 600">LinkedIn</a><a href="https://www.instagram.com/wips.global/" style="color: #090088; font-weight: 600">Instagram · @wips.global</a></div>
        <div style="background: #02006C; color: #FFFFFF; border-radius: 0; padding: 28px; display: flex; flex-direction: column; gap: 10px"><span class="eyebrow" style="color: #FBE42A">Need help now?</span><span style="color: #FFFFFF; font-size: 18px">This form isn’t monitored around the clock.</span><a href="find-specialist-support.html" style="color: #FFFFFF; font-weight: 600">Find support →</a></div>
      </aside>
    </div>
  </section>

  <section id="press" style="background: #F6F1E6; padding: 120px 0">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 48px">
      <div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px"><div style="display: flex; flex-direction: column; gap: 18px"><span class="kick">Press</span><h2 class="h2">For <em class="em">journalists.</em></h2></div><p class="lead" style="max-width: 40ch">Satia Rai, founder of WIPS, is available to speak about women across protective services. For media enquiries, use the form above and choose Press.</p></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px">
        <div class="rv" style="background: #FFFFFF; border-radius: 0; padding: 32px; display: flex; flex-direction: column; gap: 16px">
          <span class="eyebrow" style="color: #090088">About WIPS, in brief</span>
          <p style="margin: 0; color: #090088">Women in Protective Services (WIPS) is a global movement for women working in, entering or aspiring to careers across protective and public safety services. Founded by Satia Rai, WIPS exists to connect, empower and champion women globally, using their collective voices, stories and experience to drive change. When women thrive, communities thrive.</p>
          <div style="display: flex; align-items: center; gap: 14px"><button type="button" class="btn ghost" onClick="{{ copyBoiler }}">{{ copyLabel }}</button></div>
        </div>
        <div class="rv" style="background: #FFFFFF; border-radius: 0; padding: 32px; display: flex; flex-direction: column; gap: 16px">
          <span class="eyebrow" style="color: #090088">Logo</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <a href="assets/img/wips-logo-01-primary.png" download="wips-logo-01-primary.png" style="text-decoration: none; background: #FBE42A; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px"><img src="assets/img/wips-logo-01-primary.png" alt="WIPS logo, 01 primary, blue" style="width: 240px; max-width: 100%; height: auto"><span style="font-size: 15px; font-weight: 700; color: #090088">01 Primary · blue · PNG</span></a>
            <a href="assets/img/wips-logo-02-reversed.png" download="wips-logo-02-reversed.png" style="text-decoration: none; background: #090088; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px"><img src="assets/img/wips-logo-02-reversed.png" alt="WIPS logo, 02 reversed, yellow" style="width: 240px; max-width: 100%; height: auto"><span style="font-size: 18px; font-weight: 700; color: #FFFFFF">02 Reversed · yellow · PNG</span></a>
          </div>
          <span style="font-size: 13px; color: rgba(9,0,136,.72)">Use the blue logo on yellow or other light backgrounds, and the yellow logo on vibrant blue. Never recolour or stretch it, never place it on light blue, and keep the full logo at least 240px wide.</span>
        </div>
      </div>

<script src="assets/js/wips-runtime.js"></script>
<script>
const TOPICS = [{ id: 'general', label: 'General question' }, { id: 'partner', label: 'Partnership' }, { id: 'press', label: 'Press' }, { id: 'idea', label: 'An idea for WIPS' }];
const BOILER = 'Women in Protective Services (WIPS) is a global movement for women working in, entering or aspiring to careers across protective and public safety services. Founded by Satia Rai, WIPS exists to connect, empower and champion women globally, using their collective voices, stories and experience to drive change. When women thrive, communities thrive.';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setIntent(o) { try { sessionStorage.setItem('wips-intent', JSON.stringify(o)); } catch (e) {} }
function readIntent() { try { const v = sessionStorage.getItem('wips-intent'); sessionStorage.removeItem('wips-intent'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function scrollToId(id) { setTimeout(() => { try { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 350); }
class Component extends DCLogic {
  state = { topic: 'general', name: '', email: '', org: '', msg: '', err: '', sent: false, copied: false };
  componentDidMount() { const it = readIntent(); if (it && it.topic) this.setState({ topic: it.topic }); }
  renderVals() {
    const s = this.state;
    const needsOrg = s.topic === 'partner' || s.topic === 'press';
    return {
      topics: TOPICS.map((t) => ({ ...t, cls: t.id === s.topic ? 'chip on' : 'chip', pressed: t.id === s.topic ? 'true' : 'false', pick: () => this.setState({ topic: t.id, err: '' }) })),
      orgLabel: s.topic === 'press' ? 'Publication' : (needsOrg ? 'Organisation' : 'Organisation (optional)'),
      orgHint: s.topic === 'press' ? 'Where will this be published?' : 'Your organisation',
      name: s.name, email: s.email, org: s.org, msg: s.msg,
      hasErr: !!s.err, err: s.err, sent: s.sent, notSent: !s.sent,
      firstName: (s.name.trim().split(/\s+/)[0]) || 'there',
      copyLabel: s.copied ? 'Copied' : 'Copy text',
      setName: (e) => this.setState({ name: e.target.value, err: '' }),
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      setOrg: (e) => this.setState({ org: e.target.value, err: '' }),
      setMsg: (e) => this.setState({ msg: e.target.value, err: '' }),
      copyBoiler: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(BOILER); } catch (x) {}
        this.setState({ copied: true });
        setTimeout(() => this.setState({ copied: false }), 2000);
      },
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const st = this.state;
        const mustOrg = st.topic === 'partner' || st.topic === 'press';
        if (!st.name.trim()) { this.setState({ err: 'Enter your name.' }); return; }
        if (!EMAIL_RE.test(st.email.trim())) { this.setState({ err: 'Enter an email address like name@example.com.' }); return; }
        if (mustOrg && !st.org.trim()) { this.setState({ err: st.topic === 'press' ? 'Enter your publication.' : 'Enter your organisation’s name.' }); return; }
        if (st.msg.trim().length < 10) { this.setState({ err: 'Add a short message.' }); return; }
        this.setState({ sent: true, err: '' });
      },
      restart: () => this.setState({ sent: false, msg: '', err: '' })
    };
  }
}
WIPS.mount(Component);
</script>
